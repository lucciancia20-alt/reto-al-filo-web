    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0a0a;
        opacity: 1;
        transition: opacity 500ms ease-out, visibility 500ms ease-out;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: clamp(150px, 34vw, 220px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.75));
        animation: raf-splash-in 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes raf-splash-in {
        0% {
          opacity: 0;
          transform: scale(0.88);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: opacity 200ms linear, visibility 200ms linear;
        }
        #app-splash img {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-500 selection:text-stone-950">
    <div id="app-splash" aria-hidden="true">

    </div>
    <script>
      window.__RAF_SPLASH_START__ = Date.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
